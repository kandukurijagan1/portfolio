<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pCrimeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="redAlert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#pCrimeBg)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Surveillance Camera / HUD View -->
  <rect x="60" y="50" width="680" height="380" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="2" />

  <!-- Camera HUD Crosshairs & Corner Brackets -->
  <path d="M80,90 L80,70 L100,70" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M720,90 L720,70 L700,70" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M80,390 L80,410 L100,410" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M720,390 L720,410 L700,410" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Live Feed Indicator -->
  <circle cx="105" cy="100" r="6" fill="#ef4444" filter="url(#glow)" />
  <text x="120" y="105" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">LIVE REC [CAM-04] • 60 FPS</text>
  <text x="610" y="105" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">YOLOv8 + OpenCV</text>

  <!-- Central Target / Face Recognition Box -->
  <g transform="translate(190, 120)">
    <!-- Bounding Box -->
    <rect width="210" height="230" rx="8" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,4" />
    <!-- Tag Pill -->
    <rect x="0" y="-14" width="180" height="24" rx="4" fill="#06b6d4" />
    <text x="8" y="3" fill="#020617" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">FACE MATCH: 98.4% [ID #4029]</text>
    
    <!-- Facial Landmarks / Mesh Points -->
    <circle cx="70" cy="85" r="4" fill="#38bdf8" />
    <circle cx="140" cy="85" r="4" fill="#38bdf8" />
    <circle cx="105" cy="120" r="3" fill="#38bdf8" />
    <path d="M85,160 Q105,175 125,160" stroke="#38bdf8" stroke-width="2" fill="none" />
    <!-- Mesh interconnects -->
    <line x1="70" y1="85" x2="105" y2="120" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <line x1="140" y1="85" x2="105" y2="120" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <line x1="105" y1="120" x2="85" y2="160" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <line x1="105" y1="120" x2="125" y2="160" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Weapon Detection Threat Box on Right -->
  <g transform="translate(440, 160)">
    <rect width="240" height="150" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="2" />
    <rect x="0" y="-14" width="200" height="24" rx="4" fill="#ef4444" />
    <text x="8" y="3" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">⚠ THREAT DETECTED (CONF: 96.8%)</text>
    
    <!-- Threat Icon & Info -->
    <path d="M30,50 L90,50 L110,80 L70,80 L60,110 L40,110 Z" fill="#ef4444" opacity="0.7" />
    <text x="130" y="65" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">CLASS: FIREARM</text>
    <text x="130" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11">AUTO-DISPATCH: ACTIVE</text>
    <text x="130" y="105" fill="#94a3b8" font-family="sans-serif" font-size="11">NOTIFYING CONTROL ROOM</text>
  </g>

  <!-- Bottom Terminal Log Strip -->
  <rect x="80" y="365" width="640" height="45" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="100" cy="388" r="5" fill="#10b981" />
  <text x="115" y="392" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">
    [SYS_OK] Pipeline streaming at 1080p • TensorFlow Inference: 14ms • Security Bot Dispatched
  </text>
</svg>
