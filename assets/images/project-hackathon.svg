<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pHackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1f" />
      <stop offset="50%" stop-color="#140f33" />
      <stop offset="100%" stop-color="#090d1f" />
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="hackGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#pHackBg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="120" r="160" fill="#a855f7" opacity="0.14" filter="url(#hackGlow)" />
  <circle cx="650" cy="360" r="140" fill="#38bdf8" opacity="0.1" filter="url(#hackGlow)" />

  <!-- Left: Main Hackathon Registration Portal UI -->
  <g transform="translate(60, 45)">
    <rect width="430" height="390" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Header -->
    <rect width="430" height="46" rx="16" fill="#1e293b" />
    <circle cx="22" cy="23" r="5" fill="#ef4444" />
    <circle cx="38" cy="23" r="5" fill="#f59e0b" />
    <circle cx="54" cy="23" r="5" fill="#10b981" />
    <text x="75" y="28" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">HackNovate 2025 • Official Registration Portal</text>
    <rect x="330" y="12" width="85" height="22" rx="11" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" />
    <text x="340" y="27" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">LIVE NOW</text>

    <!-- Hackathon Hero Banner inside UI -->
    <rect x="20" y="60" width="390" height="75" rx="12" fill="url(#purplePink)" />
    <text x="38" y="88" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">36-HOUR NATIONAL AI HACKATHON</text>
    <text x="38" y="108" fill="#fdf4ff" font-family="sans-serif" font-size="11">Saveetha School of Engineering • 1,200+ Developers Registered</text>
    <rect x="300" y="75" width="90" height="32" rx="6" fill="#0f172a" />
    <text x="312" y="96" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">₹2,00,000</text>

    <!-- Team Registration Form Preview -->
    <g transform="translate(20, 150)">
      <rect width="390" height="215" rx="10" fill="#0b0f19" stroke="#1e293b" />
      
      <!-- Team Name Field -->
      <text x="18" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">TEAM NAME</text>
      <rect x="18" y="32" width="170" height="32" rx="6" fill="#1e293b" />
      <text x="28" y="53" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">NeuralKnights</text>

      <!-- Track Selection -->
      <text x="205" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">CHOSEN TRACK</text>
      <rect x="205" y="32" width="168" height="32" rx="6" fill="#1e293b" />
      <text x="215" y="53" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="bold">AI &amp; Smart Governance</text>

      <!-- Members Badges -->
      <text x="18" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">TEAM MEMBERS (4/4)</text>
      <g transform="translate(18, 95)" font-family="sans-serif" font-size="10">
        <rect width="82" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" />
        <text x="10" y="16" fill="#38bdf8">Lead (You)</text>
        
        <rect x="90" width="82" height="24" rx="12" fill="#1e293b" stroke="#94a3b8" />
        <text x="100" y="16" fill="#e2e8f0">Member 2</text>

        <rect x="180" width="82" height="24" rx="12" fill="#1e293b" stroke="#94a3b8" />
        <text x="190" y="16" fill="#e2e8f0">Member 3</text>

        <rect x="270" width="82" height="24" rx="12" fill="#1e293b" stroke="#94a3b8" />
        <text x="280" y="16" fill="#e2e8f0">Member 4</text>
      </g>

      <!-- Submit Registration Button -->
      <rect x="18" y="145" width="355" height="42" rx="8" fill="url(#cyanGrad)" />
      <text x="125" y="171" fill="#020617" font-family="sans-serif" font-size="12" font-weight="bold">CONFIRM REGISTRATION (RSVP)</text>
    </g>
  </g>

  <!-- Right: Admin Portal & Submission Metrics -->
  <g transform="translate(515, 45)">
    <!-- Stats Card -->
    <rect width="235" height="185" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="20" y="32" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">Live Portal Analytics</text>
    
    <rect x="20" y="48" width="195" height="52" rx="8" fill="#1e293b" />
    <text x="32" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">REGISTERED TEAMS</text>
    <text x="32" y="89" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">312 Teams</text>

    <rect x="20" y="112" width="195" height="52" rx="8" fill="#1e293b" />
    <text x="32" y="132" fill="#94a3b8" font-family="sans-serif" font-size="10">SUBMISSIONS RECEIVED</text>
    <text x="32" y="153" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">284 GitHub Repos</text>

    <!-- Track Distribution -->
    <g transform="translate(0, 205)">
      <rect width="235" height="185" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="32" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">Problem Statement Tracks</text>
      <text x="20" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Generative AI &amp; Vision (42%)</text>
      <text x="20" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Smart Cities &amp; IoT (28%)</text>
      <text x="20" y="106" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• FinTech &amp; Web3 (18%)</text>
      <rect x="20" y="130" width="195" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" />
      <text x="35" y="152" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Automated Email Confirmation</text>
    </g>
  </g>
</svg>
