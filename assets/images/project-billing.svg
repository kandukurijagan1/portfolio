<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pBillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="billGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#pBillBg)" />

  <!-- Ambient light orb -->
  <circle cx="650" cy="150" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#billGlow)" />
  <circle cx="150" cy="350" r="120" fill="#10b981" opacity="0.08" filter="url(#billGlow)" />

  <!-- Main POS Screen Container -->
  <g transform="translate(60, 50)">
    <!-- Main POS Window -->
    <rect width="450" height="380" rx="16" fill="#111827" stroke="#334155" stroke-width="2" />
    
    <!-- Header -->
    <rect width="450" height="45" rx="16" fill="#1e293b" />
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="42" cy="22" r="5" fill="#f59e0b" />
    <circle cx="59" cy="22" r="5" fill="#10b981" />
    <text x="80" y="27" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">SmartMart POS • Multi-Counter v2.4</text>
    <rect x="340" y="12" width="90" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
    <text x="352" y="27" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">● COUNTER 03</text>

    <!-- Barcode Scanner Input Bar -->
    <rect x="25" y="65" width="400" height="40" rx="8" fill="#0b0f19" stroke="#8b5cf6" stroke-width="1.5" />
    <!-- Barcode Lines Graphic -->
    <g transform="translate(40, 73)" stroke="#38bdf8" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="24" stroke-width="3" />
      <line x1="6" y1="0" x2="6" y2="24" />
      <line x1="10" y1="0" x2="10" y2="24" stroke-width="4" />
      <line x1="18" y1="0" x2="18" y2="24" stroke-width="2" />
      <line x1="25" y1="0" x2="25" y2="24" stroke-width="4" />
      <line x1="33" y1="0" x2="33" y2="24" />
    </g>
    <text x="85" y="89" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">BARCODE: 890103092471 • Organic Honey 500g</text>

    <!-- Table Items Header -->
    <rect x="25" y="120" width="400" height="28" rx="6" fill="#1e293b" />
    <text x="35" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">ITEM</text>
    <text x="210" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">QTY</text>
    <text x="280" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">PRICE</text>
    <text x="360" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TOTAL</text>

    <!-- Table Rows -->
    <g transform="translate(25, 160)" font-family="sans-serif" font-size="11" fill="#e2e8f0">
      <text x="10" y="0">1. Fresh Arabica Coffee (250g)</text>
      <text x="190" y="0">2</text>
      <text x="255" y="0">$8.50</text>
      <text x="335" y="0">$17.00</text>
      <line x1="0" y1="12" x2="400" y2="12" stroke="#1e293b" />

      <text x="10" y="32">2. Almond Milk Unsweetened</text>
      <text x="190" y="32">1</text>
      <text x="255" y="32">$4.20</text>
      <text x="335" y="32">$4.20</text>
      <line x1="0" y1="44" x2="400" y2="44" stroke="#1e293b" />

      <text x="10" y="64">3. Artisan Sourdough Loaf</text>
      <text x="190" y="64">1</text>
      <text x="255" y="64">$5.50</text>
      <text x="335" y="64">$5.50</text>
      <line x1="0" y1="76" x2="400" y2="76" stroke="#1e293b" />
    </g>

    <!-- Bottom Total & Action Bar -->
    <rect x="25" y="270" width="400" height="85" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="45" y="300" fill="#94a3b8" font-family="sans-serif" font-size="12">Subtotal: $26.70 | Tax (5%): $1.34</text>
    <text x="45" y="335" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold">TOTAL: $28.04</text>
    
    <!-- Print Invoice Button -->
    <rect x="270" y="295" width="135" height="42" rx="8" fill="url(#emeraldGrad)" />
    <text x="290" y="322" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">PRINT BILL [F12]</text>
  </g>

  <!-- Right Floating MySQL & Inventory Analytics Panel -->
  <g transform="translate(535, 60)">
    <!-- Analytics Card -->
    <rect width="215" height="180" rx="14" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="18" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">MySQL Live Analytics</text>
    
    <!-- Mini Metric Cards -->
    <rect x="18" y="48" width="180" height="48" rx="8" fill="#1e293b" />
    <text x="30" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">TODAY'S REVENUE</text>
    <text x="30" y="87" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">$4,829.50</text>

    <rect x="18" y="106" width="180" height="48" rx="8" fill="#1e293b" />
    <text x="30" y="126" fill="#94a3b8" font-family="sans-serif" font-size="10">TRANSACTIONS PROCESSED</text>
    <text x="30" y="145" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">1,248 Bills</text>

    <!-- Database Schema Pill -->
    <g transform="translate(0, 205)">
      <rect width="215" height="150" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">DATABASE SCHEMA</text>
      <text x="18" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• users &amp; cashiers</text>
      <text x="18" y="72" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• inventory_stock (FK)</text>
      <text x="18" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• sales_invoices</text>
      <text x="18" y="112" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">• invoice_items_rel</text>
      <circle cx="185" cy="130" r="12" fill="#8b5cf6" />
      <text x="180" y="134" fill="#ffffff" font-family="sans-serif" font-size="12">✓</text>
    </g>
  </g>
</svg>
