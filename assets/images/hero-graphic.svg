<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15172b" />
      <stop offset="50%" stop-color="#101222" />
      <stop offset="100%" stop-color="#0a0b16" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .floating-gear { transform-origin: center; animation: rotateGear 20s linear infinite; }
    .floating-gear-rev { transform-origin: center; animation: rotateGearRev 16s linear infinite; }
    .pulse-glow { animation: pulse 3s ease-in-out infinite; }
    .float-card { animation: floatAnim 4s ease-in-out infinite; }
    @keyframes rotateGear { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotateGearRev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes floatAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
  </style>

  <!-- Card Background -->
  <rect x="20" y="20" width="560" height="480" rx="32" fill="url(#bgGrad)" stroke="#2a2e4a" stroke-width="2" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="450" cy="120" r="120" fill="#8b5cf6" opacity="0.12" filter="url(#glowPurple)" />
  <circle cx="150" cy="400" r="100" fill="#06b6d4" opacity="0.1" filter="url(#glowCyan)" />

  <!-- Background Big Gears -->
  <g class="floating-gear" opacity="0.25">
    <path d="M430,90 L435,75 L445,75 L450,90 L465,95 L475,85 L485,95 L475,110 L485,120 L500,115 L505,125 L490,135 L495,150 L510,155 L510,170 L495,175 L490,190 L505,200 L495,210 L480,205 L470,218 L478,232 L468,240 L455,230 L440,238 L435,252 L420,252 L415,238 L400,230 L388,240 L378,232 L385,218 L375,205 L360,210 L350,200 L365,190 L360,175 L345,170 L345,155 L360,150 L365,135 L350,125 L360,115 L375,120 L385,110 L378,95 L388,85 L400,95 L415,90 L420,75 L435,75 Z" fill="#94a3b8" />
    <circle cx="430" cy="165" r="35" fill="#15172b" stroke="#94a3b8" stroke-width="3" />
  </g>

  <!-- Left Bottom Gear -->
  <g class="floating-gear-rev" opacity="0.25">
    <path d="M90,380 L95,368 L103,368 L108,380 L118,383 L126,375 L134,383 L126,394 L134,402 L146,398 L150,406 L138,414 L142,426 L154,430 L154,442 L142,446 L138,458 L150,466 L142,474 L130,470 L122,480 L128,491 L120,497 L110,489 L98,495 L94,506 L82,506 L78,495 L66,489 L56,497 L48,491 L54,480 L46,470 L34,474 L26,466 L38,458 L34,446 L22,442 L22,430 L34,426 L38,414 L26,406 L30,398 L42,402 L50,394 L42,383 L50,375 L60,383 L70,380 L74,368 L86,368 Z" fill="#94a3b8" />
    <circle cx="89" cy="437" r="28" fill="#101222" stroke="#94a3b8" stroke-width="3" />
  </g>

  <!-- Main Monitor Stand -->
  <ellipse cx="300" cy="400" rx="90" ry="16" fill="#1e293b" opacity="0.6" />
  <path d="M285,340 L315,340 L325,395 L275,395 Z" fill="url(#screenGrad)" stroke="#334155" stroke-width="2" />
  <rect x="250" y="390" width="100" height="12" rx="6" fill="#334155" />

  <!-- Monitor Screen Frame -->
  <rect x="150" y="160" width="300" height="195" rx="14" fill="#0b0f19" stroke="#3b82f6" stroke-width="2.5" />
  
  <!-- Monitor Inner Display -->
  <rect x="156" y="166" width="288" height="183" rx="10" fill="url(#screenGrad)" />
  
  <!-- Screen Header / Title Bar -->
  <rect x="156" y="166" width="288" height="24" fill="#0f172a" />
  <circle cx="172" cy="178" r="4" fill="#ef4444" />
  <circle cx="184" cy="178" r="4" fill="#f59e0b" />
  <circle cx="196" cy="178" r="4" fill="#10b981" />
  <text x="215" y="182" fill="#94a3b8" font-family="monospace" font-size="10">main.py - Visual Studio Code</text>

  <!-- Screen Code Lines -->
  <rect x="175" y="205" width="40" height="7" rx="3.5" fill="#f43f5e" />
  <rect x="222" y="205" width="60" height="7" rx="3.5" fill="#38bdf8" />
  <rect x="288" y="205" width="80" height="7" rx="3.5" fill="#a855f7" />
  
  <rect x="190" y="222" width="70" height="7" rx="3.5" fill="#10b981" />
  <rect x="267" y="222" width="110" height="7" rx="3.5" fill="#e2e8f0" opacity="0.8" />

  <rect x="190" y="239" width="95" height="7" rx="3.5" fill="#fbbf24" />
  <rect x="292" y="239" width="50" height="7" rx="3.5" fill="#38bdf8" />

  <rect x="175" y="256" width="55" height="7" rx="3.5" fill="#ec4899" />
  <rect x="237" y="256" width="80" height="7" rx="3.5" fill="#818cf8" />

  <!-- Code Symbol Floating Badge on Monitor -->
  <g class="float-card">
    <rect x="175" y="280" width="64" height="42" rx="8" fill="url(#blueCyan)" filter="url(#glowCyan)" opacity="0.9" />
    <text x="207" y="308" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- Left Floating Window (Terminal / Config) -->
  <g class="float-card" style="animation-delay: -1s;">
    <rect x="65" y="140" width="110" height="90" rx="12" fill="#111827" stroke="#06b6d4" stroke-width="2" opacity="0.95" />
    <rect x="65" y="140" width="110" height="20" rx="12" fill="#1f2937" />
    <circle cx="80" cy="150" r="3" fill="#ef4444" />
    <circle cx="90" cy="150" r="3" fill="#f59e0b" />
    <circle cx="100" cy="150" r="3" fill="#10b981" />
    <rect x="80" y="172" width="50" height="5" rx="2.5" fill="#38bdf8" />
    <rect x="80" y="184" width="75" height="5" rx="2.5" fill="#9ca3af" />
    <rect x="80" y="196" width="60" height="5" rx="2.5" fill="#34d399" />
    <rect x="80" y="208" width="30" height="5" rx="2.5" fill="#818cf8" />
  </g>

  <!-- Right Floating Cloud Sync Badge -->
  <g class="float-card" style="animation-delay: -2s;">
    <rect x="420" y="145" width="105" height="90" rx="16" fill="#111827" stroke="#8b5cf6" stroke-width="2" opacity="0.95" />
    <!-- Cloud Icon -->
    <path d="M465,188 C461,188 458,185 458,181 C458,177 461,174 465,174 C466,168 471,164 477,164 C483,164 488,168 489,173 C493,174 496,177 496,181 C496,185 493,188 489,188 Z" fill="#38bdf8" />
    <!-- Down Arrow / Sync -->
    <path d="M477,175 L477,196 M472,191 L477,196 L482,191" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="438" y="208" width="70" height="5" rx="2.5" fill="#94a3b8" />
    <rect x="448" y="218" width="50" height="5" rx="2.5" fill="#a855f7" />
  </g>

  <!-- Left Gear Pill -->
  <g class="float-card" style="animation-delay: -1.5s;">
    <rect x="75" y="255" width="48" height="48" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="99" cy="279" r="10" fill="#38bdf8" />
    <circle cx="99" cy="279" r="5" fill="#0f172a" />
  </g>

  <!-- Smartphone Mockup on Right -->
  <g class="float-card" style="animation-delay: -0.5s;">
    <rect x="415" y="260" width="95" height="175" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Speaker & Notch -->
    <rect x="445" y="268" width="35" height="4" rx="2" fill="#334155" />
    <!-- Screen Area -->
    <rect x="422" y="278" width="81" height="142" rx="12" fill="#1e293b" />
    <!-- Checkmark Circle in Phone Screen -->
    <circle cx="462" cy="330" r="24" fill="#0ea5e9" opacity="0.3" />
    <circle cx="462" cy="330" r="18" fill="#10b981" />
    <path d="M455,330 L460,335 L470,324" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Phone Mini UI bars -->
    <rect x="432" y="365" width="61" height="6" rx="3" fill="#64748b" />
    <rect x="437" y="378" width="51" height="6" rx="3" fill="#38bdf8" />
    <rect x="442" y="391" width="41" height="6" rx="3" fill="#94a3b8" />
  </g>

  <!-- Bottom Accent Light Beam -->
  <path d="M120,470 L480,470" stroke="url(#cyanPurple)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>
