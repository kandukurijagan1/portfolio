<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pFoodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1b40" />
    </linearGradient>
    <linearGradient id="amberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#pFoodBg)" />

  <!-- Left: Smartphone with QR-Code Table Ordering UI -->
  <g transform="translate(70, 45)">
    <!-- Phone Outer Case -->
    <rect width="210" height="390" rx="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Dynamic Island / Speaker -->
    <rect x="75" y="14" width="60" height="12" rx="6" fill="#1e293b" />
    <!-- Screen View -->
    <rect x="14" y="36" width="182" height="336" rx="20" fill="#1e293b" />
    
    <!-- Table QR Card Banner -->
    <rect x="25" y="50" width="160" height="70" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="35" y="70" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">TABLE #12 • DINE-IN</text>
    <text x="35" y="85" fill="#94a3b8" font-family="sans-serif" font-size="9">Scan &amp; Order Live Menu</text>
    <rect x="135" y="58" width="40" height="40" rx="6" fill="#ffffff" />
    <!-- Mini QR representation -->
    <rect x="140" y="63" width="10" height="10" fill="#000000" />
    <rect x="160" y="63" width="10" height="10" fill="#000000" />
    <rect x="140" y="83" width="10" height="10" fill="#000000" />
    <rect x="153" y="73" width="5" height="5" fill="#000000" />
    <rect x="162" y="83" width="6" height="6" fill="#000000" />

    <!-- Food Menu List -->
    <g transform="translate(25, 132)">
      <!-- Item 1 -->
      <rect width="160" height="54" rx="8" fill="#111827" />
      <circle cx="28" cy="27" r="16" fill="#f59e0b" fill-opacity="0.2" />
      <text x="22" y="32" font-size="14">🍕</text>
      <text x="52" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">Truffle Pizza</text>
      <text x="52" y="38" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">$14.50</text>
      <rect x="125" y="18" width="24" height="20" rx="4" fill="#06b6d4" />
      <text x="134" y="32" fill="#020617" font-weight="bold" font-size="12">+</text>

      <!-- Item 2 -->
      <rect y="62" width="160" height="54" rx="8" fill="#111827" />
      <circle cx="28" cy="89" r="16" fill="#10b981" fill-opacity="0.2" />
      <text x="22" y="94" font-size="14">🥗</text>
      <text x="52" y="86" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">Avocado Bowl</text>
      <text x="52" y="100" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">$11.00</text>
      <rect x="125" y="80" width="24" height="20" rx="4" fill="#06b6d4" />
      <text x="134" y="94" fill="#020617" font-weight="bold" font-size="12">+</text>

      <!-- Item 3 -->
      <rect y="124" width="160" height="54" rx="8" fill="#111827" />
      <circle cx="28" cy="151" r="16" fill="#ec4899" fill-opacity="0.2" />
      <text x="22" y="156" font-size="14">🍹</text>
      <text x="52" y="148" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">Berry Cooler</text>
      <text x="52" y="162" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">$6.50</text>
      <rect x="125" y="142" width="24" height="20" rx="4" fill="#06b6d4" />
      <text x="134" y="156" fill="#020617" font-weight="bold" font-size="12">+</text>
    </g>

    <!-- Place Order Button -->
    <rect x="25" y="325" width="160" height="36" rx="8" fill="url(#amberOrange)" />
    <text x="55" y="347" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">PLACE ORDER (2)</text>
  </g>

  <!-- Right: Kitchen Display System (KDS / KOT) & Dashboard -->
  <g transform="translate(320, 50)">
    <!-- KDS Window -->
    <rect width="420" height="380" rx="16" fill="#111827" stroke="#334155" stroke-width="2" />
    
    <!-- Top Bar -->
    <rect width="420" height="46" rx="16" fill="#1e293b" />
    <text x="25" y="28" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">🍳 Kitchen Live Queue (KOT Dashboard)</text>
    <rect x="310" y="12" width="95" height="22" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" />
    <text x="325" y="27" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold">4 IN QUEUE</text>

    <!-- Ticket 1 (Table 12 - Cooking) -->
    <g transform="translate(20, 65)">
      <rect width="180" height="185" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <rect width="180" height="32" rx="10" fill="#f59e0b" fill-opacity="0.15" />
      <text x="12" y="21" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">ORDER #204 • TBL 12</text>
      <text x="135" y="21" fill="#f59e0b" font-family="sans-serif" font-size="10">04m</text>
      <text x="12" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">• 1x Truffle Pizza</text>
      <text x="12" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="11">• 1x Avocado Bowl</text>
      <text x="12" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10">Note: Extra crispy crust</text>
      
      <!-- Status Pill -->
      <rect x="12" y="140" width="156" height="32" rx="6" fill="#f59e0b" />
      <text x="45" y="160" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">COOKING [STAGE 2]</text>
    </g>

    <!-- Ticket 2 (Table 08 - Ready to Serve) -->
    <g transform="translate(220, 65)">
      <rect width="180" height="185" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <rect width="180" height="32" rx="10" fill="#10b981" fill-opacity="0.15" />
      <text x="12" y="21" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">ORDER #203 • TBL 08</text>
      <text x="135" y="21" fill="#10b981" font-family="sans-serif" font-size="10">12m</text>
      <text x="12" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">• 2x Garlic Butter Naan</text>
      <text x="12" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="11">• 1x Paneer Tikka</text>
      <text x="12" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10">Order Settled: Paid</text>
      
      <!-- Status Pill -->
      <rect x="12" y="140" width="156" height="32" rx="6" fill="#10b981" />
      <text x="50" y="160" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">READY TO SERVE</text>
    </g>

    <!-- Flask Backend & MySQL Stats Footer -->
    <g transform="translate(20, 270)">
      <rect width="380" height="85" rx="10" fill="#0f172a" stroke="#1e293b" />
      <text x="20" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">FLASK API &amp; MYSQL BACKEND</text>
      <text x="20" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Active Sessions: 18 Tables | Avg Prep Time: 11.2 min</text>
      <text x="20" y="70" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">✓ WebSockets Active • Dynamic QR Verification Enabled</text>
    </g>
  </g>
</svg>
