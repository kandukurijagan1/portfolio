<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pFishBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0d172a" />
      <stop offset="100%" stop-color="#121e36" />
    </linearGradient>
    <linearGradient id="cyanOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="fishGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#pFishBg)" />

  <!-- Ambient light -->
  <circle cx="650" cy="140" r="160" fill="#06b6d4" opacity="0.12" filter="url(#fishGlow)" />
  <circle cx="150" cy="360" r="140" fill="#3b82f6" opacity="0.1" filter="url(#fishGlow)" />

  <!-- Left: Main POS & GST Fish Billing Interface -->
  <g transform="translate(60, 45)">
    <!-- Terminal Window -->
    <rect width="440" height="390" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Title Bar -->
    <rect width="440" height="46" rx="16" fill="#1e293b" />
    <circle cx="24" cy="23" r="5" fill="#ef4444" />
    <circle cx="40" cy="23" r="5" fill="#f59e0b" />
    <circle cx="56" cy="23" r="5" fill="#10b981" />
    <text x="75" y="28" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">🐟 FishBilling Pro • Seafood Wholesale &amp; Retail POS</text>
    <rect x="330" y="12" width="95" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" />
    <text x="345" y="27" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">GST READY</text>

    <!-- Weigh Scale & Rate Ingestion Banner -->
    <rect x="22" y="62" width="396" height="50" rx="10" fill="#0b0f19" stroke="#06b6d4" stroke-width="1.5" />
    <text x="38" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10">CONNECTED DIGITAL WEIGH SCALE [RS-232]</text>
    <text x="38" y="104" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">⚖ LIVE WEIGHT: 14.850 kg</text>
    <rect x="300" y="72" width="105" height="30" rx="6" fill="url(#goldGst)" />
    <text x="312" y="92" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">₹ RATE / KG: 420</text>

    <!-- Billing Table Header -->
    <rect x="22" y="124" width="396" height="28" rx="6" fill="#1e293b" />
    <text x="32" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">VARIETY / CATCH</text>
    <text x="180" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">KG</text>
    <text x="245" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">RATE</text>
    <text x="310" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">GST</text>
    <text x="365" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">TOTAL</text>

    <!-- Table Rows -->
    <g transform="translate(22, 165)" font-family="sans-serif" font-size="11" fill="#e2e8f0">
      <text x="10" y="0">1. Fresh Seer Fish (Vanjaram)</text>
      <text x="160" y="0">14.85</text>
      <text x="225" y="0">₹420</text>
      <text x="290" y="0">0%</text>
      <text x="340" y="0">₹6,237.00</text>
      <line x1="0" y1="12" x2="396" y2="12" stroke="#1e293b" />

      <text x="10" y="32">2. Tiger Prawns (Grade A)</text>
      <text x="160" y="32">8.20</text>
      <text x="225" y="32">₹550</text>
      <text x="290" y="32">5%</text>
      <text x="340" y="32">₹4,735.50</text>
      <line x1="0" y1="44" x2="396" y2="44" stroke="#1e293b" />

      <text x="10" y="64">3. Silver Pomfret (Vavval)</text>
      <text x="160" y="64">6.50</text>
      <text x="225" y="64">₹680</text>
      <text x="290" y="64">0%</text>
      <text x="340" y="64">₹4,420.00</text>
      <line x1="0" y1="76" x2="396" y2="76" stroke="#1e293b" />
    </g>

    <!-- Total & Invoice Summary -->
    <rect x="22" y="275" width="396" height="95" rx="10" fill="#0b0f19" stroke="#1e293b" />
    <text x="38" y="305" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Weight: 29.55 kg | CGST+SGST: ₹225.50</text>
    <text x="38" y="342" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold">NET BILL: ₹15,392.50</text>
    
    <rect x="260" y="305" width="140" height="44" rx="8" fill="url(#cyanOcean)" />
    <text x="275" y="332" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">PRINT GST BILL</text>
  </g>

  <!-- Right: Wholesale Analytics & Ledger -->
  <g transform="translate(525, 45)">
    <!-- Daily Catch & Inventory Card -->
    <rect width="225" height="185" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="20" y="32" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">Harbor Catch &amp; Stock Ledger</text>
    
    <rect x="20" y="48" width="185" height="52" rx="8" fill="#1e293b" />
    <text x="32" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">TODAY'S CRATE INTAKE</text>
    <text x="32" y="89" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">840 kg Stocked</text>

    <rect x="20" y="112" width="185" height="52" rx="8" fill="#1e293b" />
    <text x="32" y="132" fill="#94a3b8" font-family="sans-serif" font-size="10">WHOLESALE DISPATCH</text>
    <text x="32" y="153" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">520 kg Invoiced</text>

    <!-- Customer Credit / Khata System -->
    <g transform="translate(0, 205)">
      <rect width="225" height="185" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="32" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">Buyer Khata / Outstanding</text>
      <text x="20" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Hotel SeaBreeze: ₹24,000</text>
      <text x="20" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Marina Exporters: ₹86,500</text>
      <text x="20" y="106" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Local Market Ctr: Paid ✓</text>
      <rect x="20" y="130" width="185" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" />
      <text x="35" y="152" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Thermal &amp; PDF Invoices</text>
    </g>
  </g>
</svg>
