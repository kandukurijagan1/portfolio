<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="avAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="avGlow">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#avBg)" stroke="url(#avAccent)" stroke-width="2" />
  
  <!-- Ambient background orb -->
  <circle cx="200" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#avGlow)" />
  <circle cx="280" cy="120" r="60" fill="#06b6d4" opacity="0.1" filter="url(#avGlow)" />

  <!-- Code elements background -->
  <g opacity="0.15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">
    <text x="30" y="60">import cv2, tensorflow as tf</text>
    <text x="30" y="85">class Developer(Person):</text>
    <text x="50" y="110">def build_future():</text>
    <text x="70" y="135">return "Innovation &amp; Impact"</text>
    <text x="30" y="340">&lt;div class="portfolio"&gt;</text>
    <text x="50" y="365">&lt;AI_Integration active={true} /&gt;</text>
  </g>

  <!-- Developer Silhouette / Illustration -->
  <g transform="translate(100, 75)">
    <!-- Shoulders / Jacket -->
    <path d="M10,240 C10,185 45,175 75,170 L125,170 C155,175 190,185 190,240 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M75,170 L100,240 L125,170" fill="#0f172a" />
    <!-- Shirt / Collar -->
    <path d="M85,170 L100,195 L115,170 Z" fill="#38bdf8" />
    <!-- Neck -->
    <rect x="88" y="140" width="24" height="35" rx="5" fill="#fcd34d" />
    <!-- Head -->
    <ellipse cx="100" cy="115" rx="42" ry="48" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M56,110 C56,65 72,55 100,55 C128,55 144,65 144,110 C138,80 120,70 100,70 C75,70 65,85 56,110 Z" fill="#1e1b4b" />
    <!-- Modern Tech Glasses -->
    <rect x="68" y="105" width="28" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect x="104" y="105" width="28" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <line x1="96" y1="112" x2="104" y2="112" stroke="#38bdf8" stroke-width="2" />
    <!-- Smile -->
    <path d="M88,140 Q100,148 112,140" stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Glowing status badge overlay -->
  <g transform="translate(130, 310)">
    <rect width="140" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#10b981" filter="url(#avGlow)" />
    <text x="35" y="22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Open to Work</text>
  </g>
</svg>
