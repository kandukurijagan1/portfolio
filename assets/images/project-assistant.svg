<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pVoiceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f" />
      <stop offset="50%" stop-color="#111736" />
      <stop offset="100%" stop-color="#181347" />
    </linearGradient>
    <linearGradient id="voicePulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="voiceGlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#pVoiceBg)" />

  <!-- Ambient light orb -->
  <circle cx="240" cy="180" r="160" fill="#38bdf8" opacity="0.15" filter="url(#voiceGlow)" />
  <circle cx="620" cy="320" r="150" fill="#c084fc" opacity="0.12" filter="url(#voiceGlow)" />

  <!-- Left: Main Desktop Assistant Interface -->
  <g transform="translate(60, 45)">
    <rect width="440" height="390" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Top Header -->
    <rect width="440" height="46" rx="16" fill="#1e293b" />
    <circle cx="24" cy="23" r="5" fill="#ef4444" />
    <circle cx="40" cy="23" r="5" fill="#f59e0b" />
    <circle cx="56" cy="23" r="5" fill="#10b981" />
    <text x="75" y="28" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">Nova AI • Real-Time Voice Desktop Assistant</text>
    <rect x="330" y="12" width="95" height="22" rx="11" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" />
    <text x="345" y="27" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">LISTENING</text>

    <!-- Soundwave Voice Spectrum Visualization -->
    <rect x="22" y="62" width="396" height="95" rx="12" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Animated-style Wave Bars -->
    <g transform="translate(45, 110)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="-16" x2="14" y2="16" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="-28" x2="28" y2="28" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" />
      <line x1="42" y1="-38" x2="42" y2="38" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
      <line x1="56" y1="-22" x2="56" y2="22" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" />
      <line x1="70" y1="-42" x2="70" y2="42" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="84" y1="-18" x2="84" y2="18" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <line x1="98" y1="-32" x2="98" y2="32" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" />
      <line x1="112" y1="-45" x2="112" y2="45" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />
      <line x1="126" y1="-26" x2="126" y2="26" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" />
      <line x1="140" y1="-12" x2="140" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="215" y="95" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">VOICE SPECTRUM: ACTIVE</text>
    <text x="215" y="115" fill="#e2e8f0" font-family="sans-serif" font-size="12">"Search DuckDuckGo &amp; send summary"</text>
    <text x="215" y="133" fill="#94a3b8" font-family="sans-serif" font-size="9">PyAudio • SpeechRecognition • pyttsx3</text>

    <!-- Terminal Command Log Area -->
    <rect x="22" y="170" width="396" height="195" rx="10" fill="#0b0f19" stroke="#1e293b" />
    
    <g transform="translate(36, 195)" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <text y="0" fill="#10b981">● [MIC_ACTIVE] Voice input captured via SpeechRecognition</text>
      <text y="24" fill="#38bdf8">▹ Intent: Query DuckDuckGo web search API</text>
      <text y="48" fill="#e2e8f0">▹ Executing: System automation &amp; browser trigger</text>
      <text y="72" fill="#f59e0b">▹ Status: Compiled PDF interaction report generated</text>
      <text y="96" fill="#a855f7">▹ Broadcast: Sent report to Telegram Bot (@NovaAssistantBot)</text>
      <text y="120" fill="#94a3b8">▹ Audio Response: Synthesized voice feedback via pyttsx3</text>
    </g>

    <!-- Quick Action Bar -->
    <rect x="36" y="325" width="368" height="28" rx="6" fill="#1e293b" />
    <text x="50" y="343" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">✓ SYSTEM AUTOMATION READY • OS FUNCTIONS CONNECTED</text>
  </g>

  <!-- Right: Telegram Bot & System Integration Card -->
  <g transform="translate(525, 45)">
    <!-- Telegram Bot Preview Card -->
    <rect width="225" height="185" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="32" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">Telegram Bot Sync</text>
    
    <rect x="20" y="48" width="185" height="52" rx="8" fill="#1e293b" />
    <text x="32" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">AUTOMATION SESSIONS</text>
    <text x="32" y="89" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">120+ Actions / Day</text>

    <rect x="20" y="112" width="185" height="52" rx="8" fill="#1e293b" />
    <text x="32" y="132" fill="#94a3b8" font-family="sans-serif" font-size="10">SPEECH LATENCY</text>
    <text x="32" y="153" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">&lt; 350ms</text>

    <!-- Desktop Automation Capabilities -->
    <g transform="translate(0, 205)">
      <rect width="225" height="185" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="32" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">OS Control Modules</text>
      <text x="20" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• App Launching &amp; Media</text>
      <text x="20" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• DuckDuckGo Web Scraper</text>
      <text x="20" y="106" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• PDF Summary Generator</text>
      <rect x="20" y="130" width="185" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" />
      <text x="35" y="152" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Voice &amp; Text Command</text>
    </g>
  </g>
</svg>
